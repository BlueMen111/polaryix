[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polaryix-api"
version = "0.1.0"
description = "API segura do Polaryix para análise de datasets."
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "pandas>=2.2.0",
    "polars>=1.5.0",
    "duckdb>=1.0.0",
    "openpyxl>=3.1.0",
    "pyarrow>=16.0.0",
    "xlrd>=2.0.1",
    "pillow>=10.4.0",
    "rembg[cpu]>=2.0.60",
    "yt-dlp>=2025.1.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]
